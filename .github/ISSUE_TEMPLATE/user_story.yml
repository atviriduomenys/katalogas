name: "User Story"
description: "Aprašyk naują Katalogo naudotojo istoriją"
title: "User Story: [Trumpas pavadinimas]"
labels: ["web:ui"]
body:
  - type: markdown
    attributes:
      value: |
        # 🧩 User Story

        Užpildyk laukus žemiau pagal mūsų User Story struktūrą.
        Jei kai kurie skyriai netaikomi (pvz. As-Is ar User Flow), juos galima praleisti.

  - type: textarea
    id: formuluote
    attributes:
      label: "Formuluotė"
      description: "Kaip <rolė>, tam, kad <tikslas>, noriu <funkcionalumas>."
      placeholder: |
        Kaip naudotojas,
        tam, kad galėčiau patogiai redaguoti duomenis naršyklėje,
        noriu matyti patogų redagavimo langą.
      render: markdown

  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > Ši formuluotė apibrėžia naudotojo poreikį ir funkcionalumo vertę.

  - type: textarea
    id: aprasymas
    attributes:
      label: "Aprašymas"
      description: "Ką šis funkcionalumas turi daryti, kokią problemą sprendžia, ar yra priklausomybių?"
      placeholder: "Paaiškink pokyčio kontekstą ir tikslą."

  - type: textarea
    id: asis
    attributes:
      label: "As-Is (jei taikoma)"
      description: "Kaip ši vieta veikia dabar?"
      placeholder: "Aprašyk dabartinį veikimą"

  - type: textarea
    id: tobe
    attributes:
      label: "To-Be (pagrindinis)"
      description: "Aprašyk, kaip sistema turėtų veikti po pakeitimo."
      placeholder: "Norimas elgesys, UI reakcijos, būsenos keitimas."

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > Jei To-Be ir Acceptance Criteria sutampa, galima rašyti tik vieną iš jų.

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > Gali pasirinkti, ar User Flow aprašysi, ar įkelsi paveikslėlį.

  - type: textarea
    id: userflow
    attributes:
      label: "User Flow (jei taikoma)"
      description: "Trumpas naudotojo kelio aprašas"
      placeholder: "Naudotojo kelias iki rezultato."

  - type: attachments
    id: userflow
    attributes:
      label: "User Flow (jei taikoma)"
      description: "Trumpas naudotojo kelias arba įkelta diagrama."
      multiple: true

  - type: attachments
    id: wireframes
    attributes:
      label: "Wireframes"
      description: "Wireframe schema, geriausia iš screenshot, su atvaizduotais pakeitimais"
      multiple: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      description: "Sąlygos, kurias įgyvendinus, istorija laikoma atlikta."
      placeholder: |
        - [ ] <UI elementas atvaizduojamas pagal dizainą>
        - [ ] <Veiksmas sukelia tinkamą reakciją>
        - [ ] <Duomenys teisingai išsaugomi>

  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Acceptance Criteria turi būti konkretūs ir patikrinami.

  - type: textarea
    id: priedai
    attributes:
      label: "Priedai"
      description: "Nuorodos į API, schemas, kitas užduotis, Task tipo užduotis techniniam įgyvendinimui ar kitus dokumentus."
      placeholder: |
        - [ ] API dokumentacija
        - [ ] Dizaino nuoroda
        - [ ] Susijusi užduotis #123
        - [ ] Techninio įgyvendinimo užduotis (Task tipo) #123
