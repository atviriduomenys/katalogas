services:
  test_db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: adp-dev
      POSTGRES_USER: adp
      POSTGRES_PASSWORD: secret
      # Keep PGDATA on the mounted path below - the image no longer defaults there.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./var/postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432