services:
  vitrina:
    volumes:
      - ".:/app"
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: vitrina-app:latest
    command:
      - ./entrypoint.sh
    environment:
      - REDIS_URL=redis://redis:6379/
      - DATABASE_URL=postgres://adp:secret@postgres:5432/adp-dev
      - DJANGO_SUPERUSER_EMAIL=test@test.com
      - DJANGO_SUPERUSER_PASSWORD=test
      - DEBUG=true
      - DJANGO_SETTINGS_MODULE=vitrina.settings
      - STATIC_ROOT=/app/static
      - RUN_MODE=DEVELOPMENT
      - CELERY_BROKER_URL=redis://redis:6379/3
    ports:
      - 8000:8000
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: adp-dev
      POSTGRES_USER: adp
      POSTGRES_PASSWORD: secret
      # postgres:18 changed the image default to /var/lib/postgresql/18/docker.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./var/postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432

  adminer:
    image: adminer
    ports:
      - 127.0.0.1:9000:8080
    environment:
      ADMINER_PLUGINS: 'tables-filter'
      ADMINER_DEFAULT_SERVER: 'postgres'

  redis:
    image: redis:latest
    restart: always
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - ./var/redis/data:/root/redis
      - ./var/redis/redis.conf:/usr/local/etc/redis/redis.conf

  celery:
    image: vitrina-app:latest
    container_name: vitrina-celery
    command: celery -A vitrina worker -l info
    environment:
      - REDIS_URL=redis://redis:6379/
      - DATABASE_URL=postgres://adp:secret@postgres:5432/adp-dev
      - DJANGO_SETTINGS_MODULE=vitrina.settings
      - CELERY_BROKER_URL=redis://redis:6379/3
    env_file:
      - .env
    volumes:
      - ".:/app"
    depends_on:
      - redis
      - postgres
    restart: always