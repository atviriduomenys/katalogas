services:
  vitrina:
    volumes:
      - ".:/app"
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - ./entrypoint.sh
    environment:
      - REDIS_URL=redis://redis:6379/
      - DATABASE_URL=postgres://adp:secret@postgres:5432/adp-dev
      - DJANGO_SUPERUSER_EMAIL=test@test.com
      - DJANGO_SUPERUSER_PASSWORD=test
      - DEBUG=true
      - DJANGO_SETTINGS_MODULE=vitrina.settings
      - STATIC_ROOT=/app/static
      - RUN=DEVELOPMENT
    ports:
      - 8000:8000
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - elasticsearch
  postgres:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: adp-dev
      POSTGRES_USER: adp
      POSTGRES_PASSWORD: secret
    volumes:
      - ./var/postgres:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432

  adminer:
    image: adminer
    ports:
      - 127.0.0.1:9000:8080
    environment:
      ADMINER_PLUGINS: 'tables-filter'
      ADMINER_DEFAULT_SERVER: 'postgres'

  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'secret'
      MYSQL_DATABASE: 'adp-dev'
      MYSQL_USER: 'adp'
      MYSQL_PASSWORD: 'secret'
    command: --init-file /data/application/init.sql
    volumes:
      - ./var/mysql:/var/lib/mysql
      - ./resources/adp-dev.sql:/data/application/init.sql
    ports:
      - 127.0.0.1:3306:3306

  elasticsearch:
    image: elasticsearch:7.8.1
    ports:
      - 127.0.0.1:9200:9200
    environment:
      discovery.type: 'single-node'
      indices.query.bool.max_clause_count: 8192
    volumes:
      - ./var/elasticsearch:/usr/share/elasticsearch/data

  redis:
    image: redis:latest
    restart: always
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - ./var/redis/dаta:/root/redis
      - ./var/redis/redis.conf:/usr/local/etc/redis/redis.conf