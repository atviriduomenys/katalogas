requests-mock = "^1.12.1"
ruff = "^0.12.10"
djlint = "^1.36.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
include = [
    "vitrina/*.py", "tests/*.py"
]
exclude = [
    "**/migrations/*.py",
]
line-length = 120
indent-width = 4

lint.extend-select = [
    "T201"  # Checks for print statements.
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"
