{% load cms_tags %}

<div class="column is-one-quarter">
    <article class="panel m-b-md">
        {% page_attribute "page_title" as current_title %}
        {% if parent %}
            <h1 class="panel-heading">
                <a href="{{ parent.get_redirect|default:parent.get_absolute_url }}">{{ parent.get_title }}</a>
            </h1>
        {% endif %}
        <nav class="category-panel">
            {% for child in children %}
                <a class="panel-block {% if current_title == child.get_title %} is-active {% endif %}"
                   href="{{ child.get_redirect|default:child.get_absolute_url }}">
                    <span class="panel-icon">
                        <i class="fas fa-book" aria-hidden="true"></i>
                    </span>
                    {{ child.get_title }}
                </a>
            {% endfor %}
        </nav>
    </article>
</div>
