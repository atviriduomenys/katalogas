{% extends "base_form.html" %}

{% block scripts %}
    {{ block.super }}
    <script type="text/javascript" nonce="{{ request.csp_nonce }}">
        $(document).ready(function () {
            const $searchInput = $("#id_search");
            const $requestsContainer = $("#div_id_requests");

            if (!$searchInput.length || !$requestsContainer.length) {
                return;
            }

            $searchInput.on("input", function () {
                const query = normalize($(this).val().trim());

                $requestsContainer.find("label.checkbox").each(function () {
                    const $label = $(this);
                    const matches = normalize($label.text()).includes(query);

                    $label.closest(".control").toggle(matches);
                });
            });

            function normalize(text) {
                return text
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "");
            }
        });
    </script>
{% endblock %}
