{% load i18n crispy_forms_tags %}
<form id="wizard-fragment-form"
      method="post"
      enctype="multipart/form-data"
      novalidate
      hx-post="{% url 'organization-change' pk=organization.pk %}"
      hx-target="#wizard-main-pane"
      hx-swap="innerHTML"
      hx-headers='{"X-Wizard-Request": "true"}'>
    {% csrf_token %}

    <div class="wizard-form-section-header">
        <p class="wizard-form-section-title">{{ organization.title }}</p>
        <p class="wizard-form-section-sub">{% translate "Redaguokite organizacijos informaciją" %}</p>
    </div>

    {% include "vitrina/_wizard_messages.html" %}
    {% include "vitrina/_wizard_form_errors.html" %}

    <div class="wizard-form-body">
        {% crispy form %}
    </div>
</form>
