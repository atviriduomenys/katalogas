<div class="creator-list-widget" id="{{ widget.attrs.id }}-wrapper">
    <input type="hidden" name="{{ widget.name }}" id="{{ widget.attrs.id }}" value="{{ widget.value|join:',' }}">

    <div class="creator-list">
        {% for creator in creators %}
        <div class="creator-item" data-id="{{ creator.id }}">
            <span class="creator-info">
                {{ creator.title }} ({{ creator.company_code }})
            </span>
            <button type="button" class="creator-remove" title="{{ remove }}">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        {% empty %}
        <div class="no-creators"> {{ no_creator }}
        </div>
        {% endfor %}
    </div>
</div>

<style>
.form-row.field-existing_creators {
    width: 50%;
}
.creator-list-widget {
    margin-bottom: 1em;
}

.creator-list {
    border: 1px solid #ccc;
    padding: 10px;
    height:300px;
    overflow-y: scroll;
}

.creator-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px;
    margin: 2px 0;
    background: #3d3f42;
    border: 1px solid #e0e0e0;
    border-radius: 3px;
}

.creator-remove {
    background: none;
    border: none;
    color: #999;
    cursor: pointer;
    padding: 0 5px;
}

.creator-remove:hover {
    color: #c00;
}

.no-creators {
    color: #666;
    font-style: italic;
    padding: 5px;
}
</style>

<script>
(function($) {
    'use strict';

    $(document).ready(function() {
        initCreatorList();
    });

    function initCreatorList() {
        const wrapper = $('.creator-list-widget');
        if (!wrapper.length) return;

        wrapper.each(function() {
            const container = $(this);
            const mainInput = container.find('input[type="hidden"]:first');
            const removedInput = $('#id_removed_creators');
            const removedCreators = new Set();

            const initialValues = mainInput.val().split(',').filter(Boolean);
            mainInput.val(initialValues.join(','));

            container.on('click', '.creator-remove', function(e) {
                e.preventDefault();
                const item = $(this).closest('.creator-item');
                const creatorId = item.data('id');

                item.fadeOut(300, function() {
                    $(this).remove();

                    removedCreators.add(creatorId);
                    removedInput.val(Array.from(removedCreators).join(','));

                    const currentValues = mainInput.val().split(',').filter(Boolean);
                    const newValues = currentValues.filter(id => id != creatorId);
                    mainInput.val(newValues.join(','));
                    if (container.find('.creator-item').length === 0) {
                        container.find('.creator-list').append(
                            $('<div class="no-creators">').text("{{ no_creator }}")
                        );
                    }
                });
            });
        });
    }

})(django.jQuery);
</script>
