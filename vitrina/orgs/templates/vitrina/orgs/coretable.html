{% load i18n parler_tags %}
{% load like_tags %}

<table class="table is-fullwidth has-border-bottom th-40 no-margin-bottom custom-table-padding">
    <tbody>
    <tr>
        <th>
            {% translate "Kodinis pavadinimas" %}
            <span class="icon info-icon has-tooltip-multiline is-middle"
                  data-tooltip="{% translate 'Organizacijos vietinė rinkinio vardų erdvė' %}">
                <i class="fas fa-info-circle"></i>
            </span>
        </th>
        <div class="tags m-t-md no-margin-bottom">
            <td class="tag">{{ organization.name }}</td>
        </div>
    </tr>
    <tr>
        <th>
            {% translate "Leidžiami kodiniai pavadinimai" %}
            <span class="icon info-icon has-tooltip-multiline is-middle"
                  data-tooltip="{% translate 'Teigiamų įvertinimų kiekis duomenų ištekliui' %}">
                <i class="fas fa-info-circle"></i>
            </span>
        </th>
        <td></td>
    </tr>
    </tbody>
</table>
