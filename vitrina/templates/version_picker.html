{% load i18n parler_tags %}

<div class="dropdown is-hoverable">
    <div class="dropdown-trigger">
        <button class="button is-primary" aria-haspopup="true" aria-controls="dropdown-menu">
            <span>
                {% if not selected_version %}
                    {% translate "Pasirinkite versiją" %}
                {% elif selected_version.external_version %}
                    {% translate "Versija" %}: {{ selected_version.external_version }}
                {% else %}
                    {% translate "Versija: Juodraštis" %}
                {% endif %}
            </span>
            <span class="icon is-small">
                <i class="fas fa-angle-down" aria-hidden="true"></i>
            </span>
        </button>
    </div>

    <div class="dropdown-menu" id="dropdown-menu" role="menu">
        <div class="dropdown-content">
            {% for version in versions %}
                <a href="{% url url_name dataset.pk version.pk %}" class="dropdown-item">
                    {% if version.external_version %}
                        {{ version.external_version }}
                    {% else %}
                        {% translate "Juodraštis" %}
                    {% endif %}
                </a>
            {% endfor %}
        </div>
    </div>
</div>
